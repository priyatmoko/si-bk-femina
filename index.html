        // Simulating Supabase Client Interface
        const mockSupabase = {
            auth: {
                signInWithPassword: async ({ email, password }) => {
                    await new Promise(r => setTimeout(r, 800)); // Simulate network
                    const user = mockDatabase.profiles.find(u => u.email === email && u.password === password);
                    if (user) {
                        const { password, ...safeUser } = user;
                        localStorage.setItem('sb_session', JSON.stringify(safeUser));
                        return { data: { user: safeUser }, error: null };
                    }
                    return { data: null, error: { message: 'Email atau kata sandi salah.' } };
                },
                signOut: async () => {
                    await new Promise(r => setTimeout(r, 300));
                    localStorage.removeItem('sb_session');
                },
                getUser: async () => {
                    const session = localStorage.getItem('sb_session');
                    return session ? { data: { user: JSON.parse(session) } } : { data: { user: null } };
                }
            },
            // Simulated Data fetching with RLS enforcement
            from: (table) => ({
                select: async (query = '*') => {
                    await new Promise(r => setTimeout(r, 400));
                    const session = JSON.parse(localStorage.getItem('sb_session'));
                    if (!session) return { data: null, error: { message: 'Unauthorized' } };

                    let data = [...(mockDatabase[table] || [])];

                    // --- SIMULATED ROW LEVEL SECURITY (RLS) ---
                    if (session.role === 'student') {
                        if (table === 'profiles') data = data.filter(d => d.id === session.id);
                        else if (table === 'discipline_records') data = data.filter(d => d.student_id === session.id);
                        else if (table === 'curhat_sessions') data = data.filter(d => d.student_id === session.id);
                        else if (table === 'menstrual_records') data = data.filter(d => d.student_id === session.id);
                        else if (table === 'safety_flags') data = []; // Students can't see flags
                    } else if (session.role === 'parent') {
                        const linkedChildId = mockDatabase.profiles.find(p => p.id === session.id)?.linked_student_id;
                        if (table === 'profiles') data = data.filter(d => d.id === session.id || d.id === linkedChildId);
                        else if (table === 'discipline_records') data = data.filter(d => d.student_id === linkedChildId);
                        else data = []; // Restrict other tables completely
                    } else if (session.role === 'teacher') {
                        // Teachers can see student profiles and discipline, but not private curhat or menstrual records
                        if (table === 'curhat_sessions') data = [];
                        if (table === 'menstrual_records') data = [];
                    }
                    // Admin sees all (in this simplified mock)

                    return { data, error: null };
                },
                insert: async (payload) => {
                     await new Promise(r => setTimeout(r, 500));
                     const session = JSON.parse(localStorage.getItem('sb_session'));
                     if (!session) return { error: { message: 'Unauthorized' } };
                     
                     const newRecord = { id: 'id_' + Math.random().toString(36).substr(2, 9), ...payload };
                     
                     // RLS Checks for insert
                     if (table === 'curhat_sessions' && session.role === 'student') {
                         newRecord.student_id = session.id;
                     } else if (table === 'discipline_records' && session.role !== 'teacher' && session.role !== 'admin') {
                         return { error: { message: 'Hanya Guru/Admin yang dapat menambah poin.' } };
                     }

                     if(!mockDatabase[table]) mockDatabase[table] = [];
                     mockDatabase[table].push(newRecord);
                     return { data: [newRecord], error: null };
                },
                update: async (payload, match) => {
                    await new Promise(r => setTimeout(r, 400));
                    // Simplified mock update
                    if(mockDatabase[table]) {
                        const index = mockDatabase[table].findIndex(item => item.id === match.id || item.student_id === match.student_id);
                        if(index > -1) {
                            mockDatabase[table][index] = { ...mockDatabase[table][index], ...payload };
                            return { data: [mockDatabase[table][index]], error: null };
                        }
                    }
                    return { error: {message: 'Record not found'} };
                }
            })
        };

                    setUser(data.user);
                    setLoading(false);
                };
                initAuth();
            }, []);

            const login = async (email, password) => {
                setLoading(true);
                const { data, error } = await mockSupabase.auth.signInWithPassword({ email, password });
                if (data?.user) setUser(data.user);
                setLoading(false);
                return { error };
            };

            const logout = async () => {
                await mockSupabase.auth.signOut();
                setUser(null);
            };

            return (
                <AuthContext.Provider value={{ user, loading, login, logout }}>
                    {children}
                </AuthContext.Provider>
            );

           		 setError('Email atau kata sandi belum benar.');

	};

            const fillDemo = (role) => {

                                onChange={e => setInput(e.target.value)}
                                placeholder="Ketik pesan di sini..." 
                                className="flex-1 bg-slate-100 border-transparent rounded-full px-4 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition-all"
                            />
                            <button type="submit" disabled={!input.trim()} className="w-10 h-10 rounded-full bg-brand-600 text-white flex items-center justify-center shrink-0 hover:bg-brand-700 disabled:opacity-50 transition-colors">
                                <Icons.ChevronRight className="w-5 h-5 ml-0.5" />
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- Teacher Views ---
        const TeacherDashboard = () => {
             const [records, setRecords] = useState([]);
             const [students, setStudents] = useState([]);
             
             useEffect(() => {
                const fetchData = async () => {
                    const [recRes, stuRes] = await Promise.all([
                        mockSupabase.from('discipline_records').select(),
                        mockSupabase.from('profiles').select()
                    ]);
                    setRecords(recRes.data || []);
                    setStudents(stuRes.data?.filter(u => u.role === 'student') || []);
                };
                fetchData();
            }, []);

            // Calculate aggregate data
            const studentPoints = {};
            records.forEach(r => {
                studentPoints[r.student_id] = (studentPoints[r.student_id] || 0) + r.points;
            });

            let highRiskCount = 0;
            let medRiskCount = 0;

            Object.values(studentPoints).forEach(pts => {
                if(pts > 30) highRiskCount++;
                else if(pts > 20) medRiskCount++;
            });

            return (
                <div className="space-y-6">
                    <header>
                        <h2 className="text-2xl font-bold text-slate-800">Dashboard Guru BK</h2>
                        <p className="text-slate-500">Ringkasan aktivitas kedisiplinan madrasah.</p>
                    </header>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <Card className="p-4 border-l-4 border-l-slate-400">
                            <p className="text-xs text-slate-500 font-medium">Total Siswa</p>
                            <h3 className="text-2xl font-bold mt-1">{students.length}</h3>
                        </Card>
                        <Card className="p-4 border-l-4 border-l-emerald-500">
                            <p className="text-xs text-slate-500 font-medium">Poin Terinput</p>
                            <h3 className="text-2xl font-bold mt-1">{records.length}</h3>
                        </Card>
                        <Card className="p-4 border-l-4 border-l-amber-500 bg-amber-50/30">
                            <p className="text-xs text-amber-700 font-medium">Perlu Pembinaan (20+ pt)</p>
                            <h3 className="text-2xl font-bold mt-1 text-amber-700">{medRiskCount}</h3>
                        </Card>
                        <Card className="p-4 border-l-4 border-l-red-500 bg-red-50/30">
                            <p className="text-xs text-red-700 font-medium">Tindak Lanjut (30+ pt)</p>
                            <h3 className="text-2xl font-bold mt-1 text-red-700">{highRiskCount}</h3>
                        </Card>
                    </div>

                    <div className="grid md:grid-cols-2 gap-6">
                        <Card>
                            <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                                <Icons.AlertTriangle className="w-5 h-5 text-red-500" />
                                Siswa Perlu Perhatian
                            </h3>
                            <div className="space-y-3">
                                {/* Dummy calculation for view */}
                                {students.filter(s => (studentPoints[s.id] || 0) > 20).map(s => (
                                    <div key={s.id} className="flex justify-between items-center p-3 rounded-xl bg-slate-50 border border-slate-100">
                                        <div>
                                            <div className="font-medium text-sm text-slate-800">{s.full_name}</div>
                                            <div className="text-xs text-slate-500">{s.class_name} • {s.nisn}</div>
                                        </div>
                                        <Badge type="danger">{studentPoints[s.id]} Poin</Badge>
                                    </div>
                                ))}
                                {students.filter(s => (studentPoints[s.id] || 0) > 20).length === 0 && 
                                    <div className="text-sm text-slate-500 text-center p-4">Tidak ada siswa berisiko tinggi saat ini.</div>
                                }
                            </div>
                        </Card>

                        <Card>
                            <h3 className="font-bold text-slate-800 mb-4">Input Terakhir</h3>
                            <div className="divide-y divide-slate-100">
                                {records.slice(0, 4).map(r => {
                                    const stu = students.find(s => s.id === r.student_id);
                                    return (
                                        <div key={r.id} className="py-2.5 flex justify-between items-start">
                                            <div>
                                                <div className="text-sm font-medium text-slate-700">{stu ? stu.full_name : 'Unknown'}</div>
                                                <div className="text-xs text-slate-500">{r.category}</div>
                                            </div>
                                            <span className={`text-xs font-bold ${r.points > 0 ? 'text-red-500' : 'text-emerald-500'}`}>
                                                {r.points > 0 ? '+' : ''}{r.points}
                                            </span>
                                        </div>
                                    )
                                })}
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        const TeacherInputEpoin = () => {
             const [students, setStudents] = useState([]);
             const [form, setForm] = useState({ student_id: '', category: 'Keterlambatan', points: 5, notes: '', date: new Date().toISOString().split('T')[0] });
             const [loading, setLoading] = useState(false);
             const [msg, setMsg] = useState('');

             useEffect(() => {
                const fetchStudents = async () => {
                    const { data } = await mockSupabase.from('profiles').select();
                    setStudents(data?.filter(u => u.role === 'student') || []);
                };
                fetchStudents();
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                const { error } = await mockSupabase.from('discipline_records').insert({
                    ...form,
                    points: parseInt(form.points)
                });
                setLoading(false);
                if(error) setMsg('Gagal: ' + error.message);
                else {
                    setMsg('Berhasil menyimpan poin.');
                    setForm({...form, notes: ''});
                    setTimeout(()=>setMsg(''), 3000);
                }
            };

            return (
                 <div className="max-w-2xl">
                    <header className="mb-6">
                        <h2 className="text-2xl font-bold text-slate-800">Input E-Poin Siswa</h2>
                    </header>

                    <Card>
                        {msg && <div className={`p-3 mb-4 rounded-lg text-sm ${msg.includes('Gagal') ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700'}`}>{msg}</div>}
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Pilih Siswa</label>
                                <select required value={form.student_id} onChange={e=>setForm({...form, student_id: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none">
                                    <option value="">-- Pilih Siswa --</option>
                                    {students.map(s => <option key={s.id} value={s.id}>{s.full_name} ({s.class_name})</option>)}
                                </select>
                            </div>
                            
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
                                    <select required value={form.category} onChange={e=>setForm({...form, category: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none">
                                        <option value="Keterlambatan">Keterlambatan</option>
                                        <option value="Seragam/Kerapian">Seragam/Kerapian</option>
                                        <option value="Ketertiban">Ketertiban Kelas</option>
                                        <option value="Alpa/Bolos">Alpa/Bolos</option>
                                        <option value="Prestasi">Prestasi (Poin Minus)</option>
                                    </select>
                                </div>
                                <div>
                                     <label className="block text-sm font-medium text-slate-700 mb-1">Bobot Poin</label>
                                     <input type="number" required value={form.points} onChange={e=>setForm({...form, points: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none" />
                                </div>
                            </div>
                            
                            <Input label="Catatan Spesifik" value={form.notes} onChange={e=>setForm({...form, notes: e.target.value})} placeholder="Misal: Terlambat 20 menit saat jam pertama" required />
                            <Input label="Tanggal Kejadian" type="date" value={form.date} onChange={e=>setForm({...form, date: e.target.value})} required />
                            
                            <Button type="submit" disabled={loading || !form.student_id} className="w-full py-3 mt-4">
                                {loading ? 'Menyimpan...' : 'Simpan Rekam Jejak'}
                            </Button>
                        </form>
                    </Card>
                 </div>
            );
        };

        const ParentDashboard = () => {
            const { user } = useContext(AuthContext);
            const [childData, setChildData] = useState(null);
            const [records, setRecords] = useState([]);

            useEffect(() => {
                const fetchData = async () => {
                    const { data: profiles } = await mockSupabase.from('profiles').select();
                    const child = profiles?.find(p => p.id === user.linked_student_id);
                    setChildData(child);

                    if(child) {
                        const { data: recs } = await mockSupabase.from('discipline_records').select();
                        setRecords(recs || []);
                    }
                };
                fetchData();
            }, [user]);

            if (!childData) return <div className="p-8 text-center text-slate-500">Memuat data anak...</div>;

            const totalPoints = records.reduce((sum, r) => sum + r.points, 0);

            return (
                <div className="space-y-6 max-w-3xl mx-auto">
                    <header className="mb-8">
                        <h1 className="text-2xl font-bold text-slate-800">Pantau Perkembangan Anak</h1>
                        <p className="text-slate-500">Transparansi madrasah untuk orang tua/wali.</p>
                    </header>

                    <Card className="flex items-center gap-4 bg-brand-50 border border-brand-100">
                        <div className="w-14 h-14 rounded-full bg-brand-200 text-brand-700 flex items-center justify-center font-bold text-xl uppercase">
                            {childData.full_name.charAt(0)}
                        </div>
                        <div>
                            <h3 className="font-bold text-lg text-slate-800">{childData.full_name}</h3>
                            <p className="text-sm text-slate-600">Kelas {childData.class_name} • NISN: {childData.nisn}</p>
                        </div>
                    </Card>

                    <Card>
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="font-bold text-slate-800">Status Kedisiplinan</h3>
                            <Badge type={totalPoints > 20 ? 'danger' : 'success'}>{calculateDisciplineStatus(totalPoints).label}</Badge>
                        </div>
                        
                        <div className="space-y-3">
                            {records.length === 0 ? (
                                <p className="text-sm text-slate-500 text-center py-4">Belum ada catatan pelanggaran. Alhamdulillah.</p>
                            ) : (
                                records.map(r => (
                                    <div key={r.id} className="flex justify-between items-center p-3 rounded-lg border border-slate-100 text-sm">
                                        <div>
                                            <span className="font-medium">{r.category}</span>
                                            <span className="text-slate-500 block text-xs mt-0.5">{r.date} • {r.notes}</span>
                                        </div>
                                        <span className={`font-bold ${r.points > 0 ? 'text-red-500' : 'text-emerald-500'}`}>{r.points} pt</span>
                                    </div>
                                ))
                            )}
                        </div>
                    </Card>
                </div>
            );
        };

        const AdminDashboard = () => {
            return (
                <div className="max-w-4xl mx-auto">
                    <header className="mb-6">
                        <h2 className="text-2xl font-bold text-slate-800">Manajemen Sistem (Admin)</h2>
                    </header>
                    <Card className="text-center py-12 border-dashed border-2">
                        <Icons.Settings className="w-12 h-12 text-slate-300 mx-auto mb-4" />
                        <h3 className="text-lg font-bold text-slate-700 mb-2">Panel Admin Sedang Dalam Pengembangan</h3>
                        <p className="text-sm text-slate-500 max-w-md mx-auto">Untuk keperluan Demo INOTEK, fungsi manajemen user (Create/Update/Delete) disimulasikan melalui database backend internal.</p>
                    </Card>
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const { user, loading } = useContext(AuthContext);
            const [showLogin, setShowLogin] = useState(false);
            const [activeTab, setActiveTab] = useState('');

            // Set default tab on login
            useEffect(() => {
                if (user && !activeTab) {
                    if (user.role === 'student') setActiveTab('home');
                    else if (user.role === 'teacher') setActiveTab('dashboard');
                    else if (user.role === 'parent') setActiveTab('child-monitor');
                    else if (user.role === 'admin') setActiveTab('admin-dash');
                }
            }, [user, activeTab]);

            if (loading) return <div className="min-h-screen flex items-center justify-center text-brand-600 font-medium">Memuat SI-BK FEMINA...</div>;

            if (!user) {
                if (showLogin) return <LoginPage onBack={() => setShowLogin(false)} />;
                return <LandingPage onLoginClick={() => setShowLogin(true)} />;
            }

            // Router based on activeTab
            const renderContent = () => {
                switch (activeTab) {
                    // Student
                    case 'home': return <StudentHome onNavigate={setActiveTab} />;
                    case 'epoin': return <StudentEPoin />;
                    case 'nisa': return <SmartAnNisa />;
                    case 'curhat': return <SahabatCurhat />;
                    // Teacher
                    case 'dashboard': return <TeacherDashboard />;
                    case 'epoin-input': return <TeacherInputEpoin />;
                    // Parent
                    case 'child-monitor': return <ParentDashboard />;
                    // Admin
                    case 'admin-dash': return <AdminDashboard />;
                    default: return <div className="p-8 text-center">Fitur dalam pengembangan.</div>;
                }
            };

            return (
                <DashboardLayout activeTab={activeTab} setActiveTab={setActiveTab}>
                    {renderContent()}
                </DashboardLayout>
            );
        };

        const Root = () => (
            <AuthProvider>
                <App />
            </AuthProvider>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>
</body>
</html>
