<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857', 900: '#064e3b' },
                        nisa: { 50: '#fdf2f8', 100: '#fce7f3', 500: '#ec4899', 600: '#db2777', 700: '#be185d', 900: '#831843' }
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useContext, createContext, useRef } = React;

        const Icon = ({ path, className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className={className}>
                <path strokeLinecap="round" strokeLinejoin="round" d={path} />
            </svg>
        );

        const Icons = {
            Home: (p) => <Icon path="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" {...p} />,
            Users: (p) => <Icon path="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" {...p} />,
            Shield: (p) => <Icon path="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" {...p} />,
            Moon: (p) => <Icon path="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" {...p} />,
            MessageCircle: (p) => <Icon path="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 01-.825-.242m9.345-8.334a2.126 2.126 0 00-.476-.095 48.64 48.64 0 00-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.221-1.147-2.143-2.368-2.143H15.15m0 0H8.85m0 0H6.482c-1.22 0-2.368.922-2.368 2.143v4.618c0 .837.46 1.58 1.155 1.951m0 0l-3 3v-300" {...p} />,
            Settings: (p) => <Icon path="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z M15 12a3 3 0 11-6 0 3 3 0 016 0z" {...p} />,
            LogOut: (p) => <Icon path="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15 M12 9l3 3m0 0l-3 3m3-3H8.25" {...p} />,
            Menu: (p) => <Icon path="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" {...p} />,
            AlertTriangle: (p) => <Icon path="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" {...p} />,
            ChevronRight: (p) => <Icon path="M8.25 4.5l7.5 7.5-7.5 7.5" {...p} />,
            Calendar: (p) => <Icon path="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5m-9-6h.008v.008H12v-.008zM12 15h.008v.008H12V15zm0 2.25h.008v.008H12v-.008zM9.75 15h.008v.008H9.75V15zm0 2.25h.008v.008H9.75v-.008zM7.5 15h.008v.008H7.5V15zm0 2.25h.008v.008H7.5v-.008zm6.75-4.5h.008v.008h-.008v-.008zm0 2.25h.008v.008h-.008V15zm0 2.25h.008v.008h-.008v-.008zm2.25-4.5h.008v.008H16.5v-.008zm0 2.25h.008v.008H16.5V15z" {...p} />,
            History: (p) => <Icon path="M3 3v5h5 M3.05 13A9 9 0 1 0 6 5.3L3 8" {...p} />
        };

        // URL GAS Anda. Masukkan di sini jika sudah ada. Kosongkan untuk mode Demo Lokal.
        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxS_dVupmTEFU0XkasXRwyxgrSqcJWlad0_1PjA8rqIbd4E2a6I5F4HDHTbFz7er9LgOw/exec"; 

        // Database bawaan jika belum terhubung ke Google Sheets
        const initialDB = {
            profiles: [
                { id: 'u1', email: 'admin@mtsn3.com', role: 'admin', full_name: 'Admin Utama', password: '123' },
                { id: 'u2', email: 'guru@mtsn3.com', role: 'teacher', full_name: 'Ibu Nisa, S.Pd', password: '123' },
                { id: 'u3', email: 'siswa1@mtsn3.com', role: 'student', full_name: 'Aisyah Rahma', nisn: '009123', class_name: 'VIII-A', gender: 'P', password: '123' },
                { id: 'u4', email: 'siswa2@mtsn3.com', role: 'student', full_name: 'Budi Santoso', nisn: '009124', class_name: 'VIII-A', gender: 'L', password: '123' },
                { id: 'u5', email: 'ortu@mtsn3.com', role: 'parent', full_name: 'Bapak Lukman', linked_student_id: 'u3', password: '123' },
            ],
            discipline_records: [
                { id: 'd1', student_id: 'u3', category: 'Keterlambatan', points: 15, notes: 'Terlambat 15 menit', date: '2026-09-01', recorded_by: 'Ibu Nisa' },
            ],
            tata_tertib: [
                { id: 't1', min: 10, max: 20, action: 'Peringatan Lisan oleh Wali Kelas' },
                { id: 't2', min: 21, max: 50, action: 'Pemanggilan Orang Tua (SP 1)' },
                { id: 't3', min: 51, max: 99, action: 'Skorsing & Pembinaan Intensif' },
                { id: 't4', min: 100, max: 999, action: 'Dikembalikan ke Orang Tua / Dikeluarkan' },
            ],
            menstrual_records: [
                { 
                    id: 'm1', student_id: 'u3', current_status: 'suci', 
                    history: [
                        { date: '2026-09-10', status: 'haid', updated_by: 'Aisyah Rahma', role: 'student' },
                        { date: '2026-09-17', status: 'suci', updated_by: 'Aisyah Rahma', role: 'student' }
                    ]
                }
            ],
            chats: [
                { id: 'c1', sender_id: 'u5', receiver_id: 'guru_bk', text: 'Assalamu alaikum, saya ortu Aisyah. Ingin tanya poin pelanggarannya.', timestamp: '08:00' },
                { id: 'c2', sender_id: 'guru_bk', receiver_id: 'u5', text: 'Waalaikumsalam Bapak. Kemarin ananda terlambat. Namun di kelas sangat aktif.', timestamp: '08:15' }
            ]
        };

       const DatabaseContext = createContext();
        
        const DatabaseProvider = ({ children }) => {
            const [db, setDb] = useState(initialDB);
            const [isDbLoaded, setIsDbLoaded] = useState(false);

            // --- TAMBAHKAN KODE PENARIK DATA DI SINI ---
            React.useEffect(() => {
                const muatDatabase = async () => {
                    try {
                        // MASUKKAN URL GOOGLE APPS SCRIPT BAPAK DI SINI
                        const URL_GAS = "https://script.google.com/macros/s/AKfycbxS_dVupmTEFU0XkasXRwyxgrSqcJWlad0_1PjA8rqIbd4E2a6I5F4HDHTbFz7er9LgOw/exec";
                        
                        // Menarik data dari sel A1 di Google Sheets
                        const response = await fetch(URL_GAS);
                        const dataServer = await response.json();
                        
                        // Jika data dari server ada isinya, kita timpa data awal (initialDB)
                        if (dataServer && Object.keys(dataServer).length > 0 && !dataServer.error) {
                            setDb(dataServer);
                        }
                    } catch (err) {
                        console.error("Gagal menarik data dari server:", err);
                    } finally {
                        // Penting: Memberitahu aplikasi bahwa proses tarik data sudah selesai
                        setIsDbLoaded(true);
                    }
                };
                
                muatDatabase(); // Eksekusi fungsinya
            }, []); // Kurung siku kosong agar hanya jalan 1x saat aplikasi baru dibuka
            // --- BATAS PENAMBAHAN KODE ---
            
            // 1. Mengambil data dari Google Sheets saat aplikasi pertama kali dibuka
            useEffect(() => {
                const url = GOOGLE_APPS_SCRIPT_URL.trim();
                if (url && url !== "https://script.google.com/macros/s/AKfycbxS_dVupmTEFU0XkasXRwyxgrSqcJWlad0_1PjA8rqIbd4E2a6I5F4HDHTbFz7er9LgOw/exec" && url !== "") {
                    fetch(url)
                        .then(res => res.json())
                        .then(serverData => {
                            // Jika server punya data, gunakan itu
                            if (serverData && Object.keys(serverData).length > 0) {
                                setDb(serverData);
                            } else {
                                // Jika Google Sheets masih kosong (pertama kali), 
                                // kirim data dummy (initialDB) ke Google Sheets agar database terisi
                                fetch(url, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                    body: JSON.stringify({ data: initialDB })
                                });
                            }
                            setIsDbLoaded(true);
                        })
                        .catch(e => {
                            console.error("Gagal terhubung ke server Google, menggunakan mode lokal (offline).", e);
                            setIsDbLoaded(true);
                        });
                } else {
                    // Jika URL belum diisi, langsung masuk mode lokal
                    setIsDbLoaded(true); 
                }
            }, []);
            
            // 2. Fungsi sinkronisasi data lokal ke Google Sheets (Tiap kali ada perubahan data)
            const syncDb = async (tableName, newData) => {
                // 1. Update tampilan layar (UI) seketika agar terasa cepat
                const updatedDb = { ...db, [tableName]: newData };
                setDb(updatedDb); 
                
                // 2. MASUKKAN URL GOOGLE APPS SCRIPT BAPAK DI SINI
                // (Gunakan URL yang SAMA PERSIS dengan yang ada di fitur Sahabat Curhat)
                const URL_GAS = "https://script.google.com/macros/s/AKfycbzHA2nAXfQOvggnNXIUjKmnatKtp3BNmxiJCOM67vKDEgulNa7xq5UHdNNctCoxbcva/exec";

                // 3. Kirim ke Google Sheets dengan membawa keterangan action: "sync_db"
                try {
                    const response = await fetch(URL_GAS, { 
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ 
                            action: "sync_db", 
                            data: updatedDb 
                        }) 
                    });
                    
                    const result = await response.json();
                    if(result.status !== 'success') {
                        console.error("Gagal menyimpan ke Google Sheets:", result.message);
                    }
                } catch (e) {
                    console.error("Gagal sinkronisasi ke server Google:", e);
                }
            };
            
            // Layar loading awal yang modern
            if (!isDbLoaded) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50">
                        <div className="w-16 h-16 bg-brand-600 rounded-2xl flex items-center justify-center font-bold text-2xl text-white mb-4 animate-pulse shadow-lg shadow-brand-500/40">SI</div>
                        <p className="text-brand-600 font-bold animate-pulse text-sm uppercase tracking-widest">Menghubungkan Server...</p>
                    </div>
                );
            }

            return (
                <DatabaseContext.Provider value={{ db, syncDb }}>
                    {children}
                </DatabaseContext.Provider>
            );
        };
        const useDatabase = () => useContext(DatabaseContext);

        const ModalContext = createContext();
        const ModalProvider = ({ children }) => {
            const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'info', onConfirm: null });
            
            const showModal = (title, message, type = 'info', onConfirm = null) => {
                setModal({ isOpen: true, title, message, type, onConfirm });
            };
            const closeModal = () => setModal(prev => ({ ...prev, isOpen: false }));

            return (
                <ModalContext.Provider value={{ showModal, closeModal }}>
                    {children}
                    {modal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl border border-slate-100 animate-fade-in">
                                <h3 className="font-bold text-xl mb-3 text-slate-800">{modal.title}</h3>
                                <p className="text-slate-600 mb-8 text-sm leading-relaxed">{modal.message}</p>
                                <div className="flex gap-3 justify-end">
                                    {modal.type === 'confirm' && (
                                        <button onClick={closeModal} className="px-5 py-2.5 text-sm font-semibold rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200">Batal</button>
                                    )}
                                    <button 
                                        onClick={() => { if(modal.onConfirm) modal.onConfirm(); closeModal(); }} 
                                        className="px-5 py-2.5 text-sm font-semibold rounded-xl bg-brand-600 text-white shadow-sm hover:bg-brand-700">
                                        {modal.type === 'confirm' ? 'Ya, Lanjutkan' : 'Mengerti'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </ModalContext.Provider>
            );
        };
        const useModal = () => useContext(ModalContext);

        const AuthContext = createContext();
        const AuthProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            
            const login = async (email, password, db) => {
                const found = db.profiles.find(p => p.email === email && p.password === password);
                if (found) { setUser(found); return { success: true }; }
                return { error: 'Email atau kata sandi salah.' };
            };
            const logout = () => setUser(null);

            return (
                <AuthContext.Provider value={{ user, login, logout, setUser }}>
                    {children}
                </AuthContext.Provider>
            );
        };

        const Button = ({ children, variant = 'primary', className = '', ...props }) => {
            const base = "px-4 py-2 rounded-xl font-semibold transition-all shadow-sm active:scale-95 disabled:opacity-50 text-sm";
            const variants = {
                primary: "bg-brand-600 text-white hover:bg-brand-700 hover:shadow-md",
                secondary: "bg-slate-100 text-slate-700 hover:bg-slate-200",
                danger: "bg-red-500 text-white hover:bg-red-600",
            };
            return <button className={`${base} ${variants[variant]} ${className}`} {...props}>{children}</button>;
        };

        const Card = ({ children, className = '' }) => (
            <div className={`bg-white rounded-2xl shadow-sm border border-slate-200 p-6 ${className}`}>{children}</div>
        );

        const Badge = ({ children, type = 'info' }) => {
            const styles = {
                success: "bg-emerald-100 text-emerald-800",
                danger: "bg-red-100 text-red-800",
                warning: "bg-amber-100 text-amber-800",
                info: "bg-blue-100 text-blue-800",
                nisa: "bg-nisa-100 text-nisa-800",
                neutral: "bg-slate-100 text-slate-800"
            };
            return <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${styles[type]}`}>{children}</span>;
        };

        const DashboardLayout = ({ children, activeTab, setActiveTab }) => {
            const { user, logout } = useContext(AuthContext);
            const [menuOpen, setMenuOpen] = useState(false);

            const navItems = {
                admin: [
                    { id: 'users', label: 'Manajemen Akun', icon: <Icons.Users/> },
                    { id: 'rules', label: 'Pengaturan Tata Tertib', icon: <Icons.Settings/> }
                ],
                teacher: [
                    { id: 'home', label: 'Tata Tertib', icon: <Icons.Home/> },
                    { id: 'students', label: 'Data Siswa & Poin', icon: <Icons.Users/> },
                    { id: 'haid', label: 'Kalender Haid', icon: <Icons.Calendar/> },
                    { id: 'chat', label: 'Pesan Masuk', icon: <Icons.MessageCircle/> }
                ],
                parent: [
                    { id: 'home', label: 'Pantau Anak', icon: <Icons.Home/> },
                    { id: 'haid', label: 'Pantau Ibadah/Haid', icon: <Icons.Calendar/>, condition: (u, db) => db.profiles.find(p=>p.id===u.linked_student_id)?.gender==='P' },
                    { id: 'chat', label: 'Pesan ke Guru BK', icon: <Icons.MessageCircle/> }
                ],
                student: [
                    { id: 'home', label: 'Beranda', icon: <Icons.Home/> },
                    { id: 'epoin', label: 'Riwayat E-Poin', icon: <Icons.Shield/> },
                    { id: 'nisa', label: 'Smart An-Nisa', icon: <Icons.Calendar/>, condition: (u) => u.gender === 'P' },
                    { id: 'curhat', label: 'Sahabat Curhat', icon: <Icons.MessageCircle/> }
                ]
            };

            const { db } = useDatabase();
            const currentNav = navItems[user.role].filter(item => item.condition ? item.condition(user, db) : true);

            return (
                <div className="flex h-screen bg-slate-50 font-sans text-slate-900 overflow-hidden">
                    {/* Sidebar Desktop */}
                    <aside className="hidden md:flex flex-col w-72 bg-white border-r border-slate-200 h-full">
                        <div className="p-6 border-b border-slate-100 flex items-center gap-3">
                            <div className="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-brand-500/30">SI</div>
                            <div>
                                <h1 className="font-bold text-lg text-slate-800 leading-tight">SI-BK FEMINA</h1>
                                <p className="text-[10px] font-medium text-slate-500 uppercase tracking-widest">MTsN 3 Magetan</p>
                            </div>
                        </div>
                        <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto">
                            {currentNav.map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-sm font-medium ${activeTab === item.id ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}>
                                    <span className={activeTab === item.id ? 'text-brand-600' : 'text-slate-400'}>{item.icon}</span>
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-100">
                            <button onClick={logout} className="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-xl transition-colors text-sm font-medium"><Icons.LogOut/> Keluar</button>
                        </div>
                    </aside>

                    {/* Konten Utama */}
                    <main className="flex-1 flex flex-col h-full relative overflow-hidden">
                        <header className="bg-white/80 backdrop-blur-md border-b border-slate-200 p-4 flex justify-between items-center z-10">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setMenuOpen(!menuOpen)} className="md:hidden p-2 text-slate-500 hover:bg-slate-100 rounded-lg"><Icons.Menu/></button>
                                <div>
                                    <h2 className="font-bold text-slate-800 text-sm hidden md:block">Profil: {user.full_name}</h2>
                                </div>
                            </div>
                            <Badge type="info">{user.role.toUpperCase()}</Badge>

        const TeacherHaid = () => {
            const { db, syncDb } = useDatabase();

            const { user } = useContext(AuthContext);
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            
            const femaleStudents = db.profiles.filter(p => p.role === 'student' && p.gender === 'P');

            const getStatusOnDate = (sid) => {
                const rec = db.menstrual_records.find(r => r.student_id === sid);
                if(!rec) return 'suci';
                const match = rec.history.find(h => h.date.startsWith(selectedDate));
                if(match) return match.status;
                return rec.current_status;
            };

            const toggleStatus = (student) => {
                const current = getStatusOnDate(student.id);
                const nextStatus = current === 'suci' ? 'haid' : 'suci';
                showModal("Ubah Status", `Ubah ${student.full_name} menjadi ${nextStatus.toUpperCase()} untuk tanggal ${selectedDate}?`, "confirm", () => {
                    let recs = [...db.menstrual_records];
                    let idx = recs.findIndex(r => r.student_id === student.id);
                    const entry = { date: selectedDate, status: nextStatus, updated_by: user.full_name, role: 'teacher' };
                    if(idx > -1) { recs[idx].current_status = nextStatus; recs[idx].history.unshift(entry); }
                    else { recs.push({ id: 'm'+Date.now(), student_id: student.id, current_status: nextStatus, history: [entry] }); }
                    syncDb('menstrual_records', recs);
                });
            };

            return (

                                        <div>
                                            <div className="font-bold text-sm text-slate-800">{contacts.find(c=>c.id===activeContact)?.name}</div>
                                            {isParent && <div className="text-[10px] text-emerald-600 font-bold">{aiMode ? 'AI Assistant Aktif' : 'Terhubung ke Guru BK'}</div>}
                                        </div>
                                    </div>
                                    {isParent && aiMode && <button onClick={()=>setAiMode(false)} className="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">Beralih ke Guru Manusia</button>}
                                </header>
                                <div className="flex-1 overflow-y-auto p-4 space-y-2">
                                    {relevantChats.map(m => {
                                        const isMe = m.sender_id === user.id;
                                        return (
                                            <div key={m.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                                <div className={`max-w-[85%] rounded-xl px-3 py-2 text-sm shadow-sm ${isMe ? 'bg-[#d9fdd3] text-slate-800 rounded-tr-none' : 'bg-white text-slate-800 rounded-tl-none'}`}>
                                                    {m.text}
                                                    <div className="text-[9px] text-right text-slate-400 mt-1">{m.timestamp}</div>
                                                </div>
                                            </div>
                                        )
                                    })}
                                    <div ref={chatEndRef} />
                                </div>
                                <form onSubmit={handleSend} className="bg-slate-100 p-3 flex gap-2 shrink-0">
                                    <input type="text" value={input} onChange={e=>setInput(e.target.value)} placeholder="Ketik pesan..." className="flex-1 rounded-full px-4 py-2 text-sm outline-none border border-white focus:border-emerald-300 focus:ring-1 focus:ring-emerald-300" />
                                    <button type="submit" disabled={!input.trim()} className="w-10 h-10 bg-emerald-600 text-white rounded-full flex items-center justify-center disabled:opacity-50"><Icons.ChevronRight/></button>
                                </form>
                            </>
                        ) : (
                            <div className="flex-1 flex items-center justify-center text-slate-400"><p>Pilih kontak untuk membaca pesan.</p></div>
                        )}
                    </div>
                </div>
            )
        };

        const ParentHome = () => {
            const { user } = useContext(AuthContext);
            const { db } = useDatabase();
            const child = db.profiles.find(p => p.id === user.linked_student_id);
            const records = db.discipline_records.filter(r => r.student_id === child?.id);
            const total = records.reduce((a, b) => a + b.points, 0);

            if(!child) return <div>Anak belum terhubung.</div>;

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                     <header><h2 className="text-2xl font-bold text-slate-800">Pantau Anak: {child.full_name}</h2></header>
                     <Card className="bg-gradient-to-br from-slate-800 to-slate-900 text-white border-none flex justify-between items-center">
                         <div><p className="text-slate-400 text-sm">Total Poin Pelanggaran</p><h3 className="text-5xl font-extrabold mt-1">{total}</h3></div>
                         <div className="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center"><Icons.Shield className="w-8 h-8 text-white/50" /></div>
                    </Card>
                    <Card className="p-0 overflow-hidden">
                        <div className="p-4 bg-slate-50 border-b font-bold text-slate-700">Rincian Riwayat</div>
                        <div className="divide-y divide-slate-100">
                            {records.length === 0 ? <p className="p-4 text-center text-slate-500">Belum ada pelanggaran.</p> :
                                records.map(r => (
                                    <div key={r.id} className="p-4 flex justify-between items-center hover:bg-slate-50">
                                        <div><div className="font-bold">{r.category}</div><div className="text-xs text-slate-500 mt-1">{r.date} • {r.notes} ({r.recorded_by})</div></div>
                                        <Badge type="danger">+{r.points} Poin</Badge>
                                    </div>
                                ))
                            }
                        </div>
                    </Card>
                </div>
            )
        };

        const ParentHaid = () => {
            const { user } = useContext(AuthContext);
            const { db } = useDatabase();
            const rec = db.menstrual_records.find(r => r.student_id === user.linked_student_id);
            if(!rec) return <div>Belum ada data.</div>;
            const isHaid = rec.current_status === 'haid';

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    <header><h2 className="text-2xl font-bold text-slate-800">Pantau Kewajiban Ibadah Anak</h2></header>
                    <Card className={`border-l-4 ${isHaid ? 'border-l-red-500 bg-red-50' : 'border-l-emerald-500 bg-emerald-50'}`}>
                         <h3 className="font-bold mb-2">Status: {isHaid ? 'Haid (Udzur)' : 'Suci (Wajib Sholat)'}</h3>
                         <p className="text-sm text-slate-600">{isHaid ? 'Ananda sedang masa udzur. Tidak wajib sholat/puasa.' : 'Ananda dalam masa suci. Mohon bimbing sholat 5 waktunya.'}</p>
                    </Card>
                    <Card>
                        <h3 className="font-bold mb-4">Riwayat Perubahan Status</h3>
                        <div className="space-y-2 text-sm">
                            {rec.history.map((h, i) => (
                                <div key={i} className="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-100">
                                    <div><p className="font-bold">Lapor {h.status}</p><p className="text-xs text-slate-500 mt-0.5">Oleh: {h.updated_by} ({h.role})</p></div>
                                    <span className="text-xs font-medium text-slate-500">{h.date}</span>
                                </div>
                            ))}
                        </div>
                    </Card>
                </div>
            )
        };

        const StudentHome = ({ onNavigate }) => {
            const { user } = useContext(AuthContext);
            const { db } = useDatabase();
            const pts = db.discipline_records.filter(r=>r.student_id===user.id).reduce((a,b)=>a+b.points,0);

            return (
                <div className="space-y-6">
                    <header className="mb-8">
                        <h1 className="text-2xl font-bold text-slate-800">Assalamu'alaikum, {user.full_name.split(' ')[0]} 👋</h1>
                        <p className="text-slate-500">Semoga harimu di madrasah menyenangkan.</p>
                    </header>
                    <div className="grid md:grid-cols-2 gap-6">
                        <Card className="bg-gradient-to-br from-brand-500 to-brand-700 text-white border-none shadow-lg">
                            <p className="text-brand-100 text-sm font-medium mb-1">Total Poin Kedisiplinan</p>
                            <h2 className="text-4xl font-extrabold mb-4">{pts}</h2>
                            <Button onClick={() => onNavigate('epoin')} className="w-full bg-white text-brand-700 hover:bg-brand-50">Cek Riwayat E-Poin</Button>
                        </Card>
                        {user.gender === 'P' && (
                            <Card className="cursor-pointer hover:border-nisa-300 transition-colors flex flex-col justify-center" onClick={() => onNavigate('nisa')}>
                                <div>
                                    <h3 className="text-xl font-bold text-slate-800">Smart An-Nisa</h3>
                                    <p className="text-sm text-slate-500 mt-2">Lapor Haid & Materi Fikih.</p>
                                </div>
                            </Card>
                        )}
                    </div>
                </div>
            );
        };

        const StudentEPoin = () => {
            const { db } = useDatabase();
            const { user } = useContext(AuthContext);
            const records = db.discipline_records.filter(r => r.student_id === user.id);
            return (
                <div className="max-w-2xl">
                    <header className="mb-6"><h2 className="text-2xl font-bold">Riwayat E-Poin</h2></header>
                    <Card className="p-0 overflow-hidden divide-y divide-slate-100">
                         {records.length === 0 ? <div className="p-6 text-center text-slate-500">Belum ada riwayat pelanggaran. Pertahankan!</div> :
                          records.map(r => (
                            <div key={r.id} className="p-4 flex justify-between items-center hover:bg-slate-50">
                                <div><div className="font-bold">{r.category}</div><div className="text-xs text-slate-500 mt-1">{r.date} • {r.notes}</div></div>
                                <Badge type="danger">+{r.points} Poin</Badge>
                            </div>
                        ))}
                    </Card>
                </div>
            );
        };

        const StudentAnNisa = () => {
            const { user } = useContext(AuthContext);
            const { db, syncDb } = useDatabase();
            const { showModal } = useModal();
            const rec = db.menstrual_records.find(r => r.student_id === user.id) || { current_status: 'suci', history: [] };
            
            const handleUpdate = (newStatus) => {
                const isHaid = newStatus === 'haid';
                showModal(
                    isHaid ? "Lapor Mulai Haid" : "Lapor Sudah Suci", 
                    isHaid ? "Yakin melaporkan mulai haid hari ini? Status kewajiban sholatmu akan dinonaktifkan." : "Yakin melaporkan sudah mandi wajib dan suci? Kewajiban sholatmu akan kembali aktif.",
                    "confirm",
                    () => {
                        const entry = { date: new Date().toISOString().split('T')[0], status: newStatus, updated_by: user.full_name, role: 'student' };
                        let recs = [...db.menstrual_records];
                        const idx = recs.findIndex(r => r.student_id === user.id);
                        if(idx > -1) { recs[idx].current_status = newStatus; recs[idx].history.unshift(entry); }
                        else { recs.push({ id: 'm'+Date.now(), student_id: user.id, current_status: newStatus, history: [entry] }); }
                        syncDb('menstrual_records', recs);
                        showModal("Sukses", "Status berhasil diperbarui dan telah dikirim ke Guru BK.");
                    }
                );
            };

            const isHaid = rec.current_status === 'haid';

            return (
                <div className="max-w-3xl space-y-6">
                    <header><h2 className="text-2xl font-bold">Smart An-Nisa</h2></header>
                    <Card className={`border-t-4 ${isHaid ? 'border-t-red-500 bg-red-50/50' : 'border-t-emerald-500 bg-emerald-50/50'}`}>
                        <div className="flex justify-between items-start mb-6">
                            <div><h3 className="font-bold text-lg mb-1">Status Kamu</h3><p className="text-sm text-slate-600">{isHaid ? 'Sedang Haid.' : 'Dalam masa Suci (Wajib Sholat).'}</p></div>
                            <Badge type={isHaid ? 'danger' : 'success'}>{isHaid ? 'Bebas Sholat' : 'Wajib Sholat'}</Badge>
                        </div>
                        <div className="flex gap-3">
                            <Button onClick={()=>handleUpdate('haid')} disabled={isHaid} variant={!isHaid?'danger':'secondary'} className="flex-1 py-3 text-sm">Lapor Mulai Haid</Button>
                            <Button onClick={()=>handleUpdate('suci')} disabled={!isHaid} variant={isHaid?'primary':'secondary'} className="flex-1 py-3 text-sm">Lapor Sudah Suci</Button>
                        </div>
                    </Card>

                    <Card>
                        <h3 className="font-bold mb-4">Riwayat Perubahan Status</h3>
                        <div className="space-y-2 max-h-48 overflow-y-auto text-sm">
                            {rec.history.length === 0 ? <p className="text-slate-500">Belum ada data.</p> : 
                                rec.history.map((h, i) => (
                                    <div key={i} className="flex justify-between items-center p-3 bg-slate-50 border border-slate-100 rounded-lg">
                                        <div>
                                            <p className="font-bold">Diubah jadi {h.status}</p>
                                            <p className="text-xs text-slate-500 mt-1">Oleh: {h.updated_by} {h.role==='teacher' && '(Guru BK)'}</p>
                                        </div>
                                        <span className="text-xs font-medium text-slate-500">{h.date}</span>
                                    </div>
                                ))
                            }
                        </div>
                    </Card>

                    <h3 className="font-bold text-lg pt-4">Materi Edukasi Fikih</h3>
                    <div className="grid md:grid-cols-2 gap-4">
                        <Card className="bg-nisa-50 border-none"><h4 className="font-bold text-nisa-700 mb-2">Niat Mandi Wajib</h4><p className="text-sm italic mb-2">"Nawaitul ghusla liraf'il hadasil akbari minal haidi fardhan lillahi ta'ala"</p><p className="text-xs text-slate-600">Sengaja aku mandi besar untuk menghilangkan hadas haid, fardhu karena Allah Ta'ala.</p></Card>
                        <Card className="bg-blue-50 border-none"><h4 className="font-bold text-blue-700 mb-2">Amalan Saat Haid</h4><ul className="list-disc pl-4 text-sm text-slate-700 space-y-1"><li>Berdzikir pagi petang</li><li>Mendengarkan Murottal</li><li>Berdoa & Bersedekah</li></ul></Card>
                    </div>
                </div>
            );
        };

        const StudentCurhat = () => {
            const { user } = useContext(AuthContext);
            const [msgs, setMsgs] = useState([{ id: 1, sender: 'ai', text: `Halo ${user.full_name.split(' ')[0]}. Ini ruang aman. Ada yang ingin kamu ceritakan hari ini?` }]);
            const [input, setInput] = useState('');
            const [typing, setTyping] = useState(false);
            const endRef = useRef(null);
            
            useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [msgs, typing]);

            const handleSend = async (e) => {
                e.preventDefault();
                if(!input.trim()) return;

                // 1. Memunculkan pesan siswa di layar
                const teksSiswa = input;
                setMsgs(p => [...p, { id: Date.now(), sender: 'user', text: teksSiswa }]);
                setInput(''); 
                setTyping(true); // Memunculkan animasi loading AI

                try {
                    // 2. MASUKKAN URL GOOGLE APPS SCRIPT BAPAK DI BAWAH INI
                    const URL_GAS = "https://script.google.com/macros/s/AKfycbzHA2nAXfQOvggnNXIUjKmnatKtp3BNmxiJCOM67vKDEgulNa7xq5UHdNNctCoxbcva/exec";

                    // 3. Mengirim pesan ke Otak AI di Google Apps Script
                    const response = await fetch(URL_GAS, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "chat_ai",
                            message: teksSiswa
                        })
                    });

                   const data = await response.json();

                    // 4. Memunculkan balasan dari AI ke layar
                    if (data.status === 'success') {
                        setMsgs(p => [...p, { id: Date.now() + 1, sender: 'ai', text: data.reply }]);
                    } else {
                        // TAMPILKAN PESAN ERROR ASLI DARI SERVER KE LAYAR CHAT
                        setMsgs(p => [...p, { id: Date.now() + 1, sender: 'ai', text: "ERROR DARI SERVER: " + data.message }]);
                    }
            
                } catch (err) {
                    console.error("Error Sahabat Curhat:", err);
                    // TAMPILKAN ERROR KONEKSI JIKA INTERNET PUTUS
                    setMsgs(p => [...p, { 
                        id: Date.now() + 1, 
                        sender: 'ai', 
                        text: 'ERROR APLIKASI: ' + err.message 
                    }]);
                }
            
                // Mematikan animasi loading
                setTyping(false);
            };

            return (
                <div className="flex flex-col h-[calc(100vh-120px)] w-full bg-white md:border border-slate-200 overflow-hidden">
                    <header className="p-4 border-b bg-slate-50 flex items-center gap-3 shrink-0">
                        <div className="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center relative"><Icons.MessageCircle className="text-blue-600"/><span className="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 border-2 border-white rounded-full"></span></div>
                        <div><h3 className="font-bold text-sm">Sahabat Curhat (AI)</h3><p className="text-xs text-slate-500">Dukungan Emosional Awal</p></div>
                    </header>
                    <div className="bg-amber-50 p-2 text-center text-[10px] text-amber-800 font-medium shrink-0">Perhatian: AI bukan psikolog. Percakapan sensitif diteruskan ke Guru BK.</div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
                        {msgs.map(m => (
                            <div key={m.id} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-sm shadow-sm ${m.sender === 'user' ? 'bg-brand-600 text-white rounded-br-sm' : 'bg-white border text-slate-700 rounded-bl-sm'}`}>{m.text}</div>
                            </div>
                        ))}
                        {typing && <div className="text-sm text-slate-400 italic">Sahabat Curhat sedang mengetik...</div>}
                        <div ref={endRef} />
                    </div>
                    <form onSubmit={handleSend} className="p-3 bg-white border-t flex gap-2">
                        <input type="text" value={input} onChange={e=>setInput(e.target.value)} placeholder="Tulis di sini..." className="flex-1 bg-slate-100 rounded-full px-4 py-2 text-sm outline-none" />
                        <button type="submit" disabled={!input.trim()} className="w-10 h-10 rounded-full bg-brand-600 text-white flex justify-center items-center"><Icons.ChevronRight/></button>
                    </form>
                </div>
            );
        };

        const LoginPage = () => {
            const [email, setEmail] = useState('admin@mtsn3.com');
            const [password, setPassword] = useState('123');
            const { login } = useContext(AuthContext);
            const { db } = useDatabase();
            const { showModal } = useModal();

            const handleSubmit = async (e) => {
                e.preventDefault();
                const res = await login(email, password, db);
                if(res.error) showModal("Gagal Login", res.error, "info");
            };

            const loadDemo = (role) => {
                const map = { admin: 'admin@mtsn3.com', teacher: 'guru@mtsn3.com', student: 'siswa1@mtsn3.com', parent: 'ortu@mtsn3.com' };
                setEmail(map[role]); setPassword('123');
            };

            return (
                <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                    <div className="w-full max-w-md">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-brand-600 rounded-2xl flex items-center justify-center font-bold text-2xl text-white mx-auto shadow-lg shadow-brand-500/30 mb-4">SI</div>
                            <h1 className="text-2xl font-bold text-slate-800">Masuk ke SI-BK FEMINA</h1>
                            <p className="text-slate-500 text-sm mt-2">Project Inovasi MTsN 3 Magetan</p>
                        </div>
                        <Card>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div><label className="block text-sm font-medium mb-1">Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full px-4 py-2 rounded-xl border border-slate-200 outline-none focus:border-brand-500" required/></div>
                                <div><label className="block text-sm font-medium mb-1">Kata Sandi</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full px-4 py-2 rounded-xl border border-slate-200 outline-none focus:border-brand-500" required/></div>
                                <Button type="submit" className="w-full py-3">Masuk Sekarang</Button>
                            </form>
                            <div className="mt-8 pt-6 border-t border-slate-100 text-center">
                                <p className="text-xs font-bold text-slate-400 mb-4 uppercase">Akun Demo Cepat</p>
                                <div className="grid grid-cols-2 gap-2">
                                    <Button variant="secondary" onClick={()=>loadDemo('admin')} className="text-xs">Isi Admin</Button>
                                    <Button variant="secondary" onClick={()=>loadDemo('teacher')} className="text-xs">Isi Guru BK</Button>
                                    <Button variant="secondary" onClick={()=>loadDemo('student')} className="text-xs">Isi Siswa</Button>
                                    <Button variant="secondary" onClick={()=>loadDemo('parent')} className="text-xs">Isi Wali Murid</Button>
                                </div>
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        const App = () => {
            const { user } = useContext(AuthContext);
            const [activeTab, setActiveTab] = useState('');

            useEffect(() => {
                if (user && !activeTab) {
                    if (user.role === 'student') setActiveTab('home');
                    else if (user.role === 'teacher') setActiveTab('home');
                    else if (user.role === 'parent') setActiveTab('home');
                    else if (user.role === 'admin') setActiveTab('users');
                }
            }, [user, activeTab]);

            if (!user) return <LoginPage />;

            const renderContent = () => {
                switch (activeTab) {
                    // Admin
                    case 'users': return <AdminDashboardUsers />;
                    case 'rules': return <AdminDashboardRules />;
                    // Teacher
                    case 'home': return user.role === 'teacher' ? <TeacherHome /> : (user.role === 'parent' ? <ParentHome /> : <StudentHome onNavigate={setActiveTab} />);
                    case 'students': return <TeacherStudents />;
                    case 'haid': return user.role === 'teacher' ? <TeacherHaid /> : <ParentHaid />;
                    case 'chat': return <ChatApp isParent={user.role === 'parent'} />;
                    // Student
                    case 'epoin': return <StudentEPoin />;
                    case 'nisa': return <StudentAnNisa />;
                    case 'curhat': return <StudentCurhat />;
                    default: return <div>Halaman tidak ditemukan.</div>;
                }
            };

            return <DashboardLayout activeTab={activeTab} setActiveTab={setActiveTab}>{renderContent()}</DashboardLayout>;
        };

        const Root = () => (
            <DatabaseProvider>
                <ModalProvider>
                    <AuthProvider>
                        <App />
                    </AuthProvider>
                </ModalProvider>
            </DatabaseProvider>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>
</body>
</html>
